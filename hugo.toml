baseURL = 'https://www.victorexplore.com/'
languageCode = 'en-us'
title = 'Victor'
theme = 'PaperMod'
enableRobotsTXT = true

[params]
  # Hugo removed site.Author; PaperMod's rss.xml falls back to it unless this is set.
  author = "Victor"
  math = true
  ShowPageNavigation = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowPostNavLinks = true
  enableEmoji = true
  showtoc = true
  hideMeta = false
  mainSections = ["posts"]
  enableDropdownMenu = true

  # The home page: a short intro, then the newest posts.
  [params.homeInfoParams]
    Title = "Victor"
    Content = "I build AI agents and I write down what I learn. Here you find my notes on machine learning, deep learning and reinforcement learning, step-by-step guides for n8n automation, and the things I make, like the [1000 Cuts game](https://1000cuts.victorexplore.com/) and the [LastCig app](/lastcig/)."

  [params.footer]
    text = "[About](/about/) · [Contact](/contact/) · [Privacy](/privacy/)"

  [params.profileMode]
    enabled = false
    title = "Victor"
    subtitle = "I talk about AI"
    subtitle2 = "And share insights about technology, society, and personal growth"
    imageUrl = "/images/profile.png"
    imageTitle = "Profile Picture"
    imageWidth = 120 # custom size
    imageHeight = 120 # custom size

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/victor_explore"
  [[params.socialIcons]] # optional
    name = "github"
    url = "https://github.com/victor-explore"

  [params.social]
    facebook_admin = "" # If you have a Facebook admin ID
    twitter = "victor_explore" # Your Twitter handle without @

  [params.assets]
    favicon = "/images/profile.png"
    favicon16x16 = "/images/profile.png"
    favicon32x32 = "/images/profile.png"
    apple_touch_icon = "/images/profile.png"

[menu]
  [[menu.main]]
    identifier = "buy-ai-agents"
    name = "🛒 Buy AI Agents"
    url = "https://shop.victorexplore.com/"
    weight = 15
    params = { newTab = true }
  [[menu.main]]
    identifier = "ai-agent-builder-community"
    name = "🤖 AI Agent Builder Community"
    url = "https://x.com/i/communities/1918880733730603290"
    weight = 20
    params = { newTab = true }
  [[menu.main]]
    identifier = "discord-community"
    name = "💬 Discord Community"
    url = "https://discord.com/invite/QHAbprqQme"
    weight = 25
    params = { newTab = true }
  [[menu.main]]
    identifier = "posts"
    name = "📝 Posts"
    url = "/posts/"
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# Add ignoreLogs configuration to suppress specific warnings
ignoreLogs = ['warning-partial-superfluous-prefix']
